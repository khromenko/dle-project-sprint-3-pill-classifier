[project]
name = "3-sprint-pills-classifier"
version = "0.1.0"
description = "CV NN for pills classification"
readme = "README.md"
authors = [
    { name = "Alex", email = "alexrk6@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.14.0",
    "dotenv>=0.9.9",
    "ipywidgets>=8.0.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn==1.6.1",
    "tokenizers>=0.13.0",
    "torch>=2.0.0",
    "torchsummary>=1.5.1",
    "torchvision==0.22.0+cpu",
    "tqdm>=4.65.0",
    "transformers>=4.30.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
